<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SmartFix</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        .container {
            max-width: 400px;
            margin: 80px auto;
            padding: 35px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 15px #ddd;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        p {
            text-align: center;
            color: #555;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #1e3a8a;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1e3a8a;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Reset Password</h1>

        <p>Create a new password for your SmartFix account.</p>

        <form method="POST">

            <label>New Password</label>
            <input type="password"
                   name="password"
                   minlength="8"
                   autocomplete="new-password"
                   required>

            <label>Confirm Password</label>
            <input type="password"
                   name="confirm_password"
                   minlength="8"
                   autocomplete="new-password"
                   required>

            <button type="submit">
                Reset Password
            </button>

        </form>

        <a href="/login">← Back to Login</a>

    </div>

</body>
</html>
