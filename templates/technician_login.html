<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Technician Login | SmartFix</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #071e19, #103c30, #17634b);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            background: #d8f5e7;
            color: #116149;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 30px;
        }

        .logo h1 {
            font-size: 32px;
            color: #103c30;
            letter-spacing: -1px;
        }

        .logo h1 span {
            color: #16a36c;
        }

        .subtitle {
            margin-top: 8px;
            color: #687c74;
            font-size: 14px;
        }

        .technician-badge {
            display: inline-block;
            background: #e1f7eb;
            color: #116149;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 16px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #24473a;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d4e5dc;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #16a36c;
            box-shadow: 0 0 0 3px rgba(22, 163, 108, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #116149;
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #116149, #16a36c);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, #0a4635, #118658);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(17, 97, 73, 0.25);
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        .links a {
            display: inline-block;
            color: #116149;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 15px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #8b9b93;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 22px;
            }

            .logo h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">

            <div class="logo-icon">🔧</div>

            <h1>Smart<span>Fix</span></h1>

            <p class="subtitle">
                Smart Repair Management System
            </p>

            <div class="technician-badge">
                TECHNICIAN PORTAL
            </div>

        </div>

        <form method="POST">

            <div class="form-group">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                        id="toggleBtn"
                    >
                        Show
                    </button>

                </div>

            </div>

            <button type="submit" class="login-btn">
                Login to Technician Dashboard →
            </button>

        </form>

        <div class="links">

            <a href="/technician-register">
                New Technician? Create Account
            </a>

            <br>

            <a href="/">
                ← Back to Home
            </a>

        </div>

        <div class="footer">
            © SmartFix | Technician Access
        </div>

    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const toggleBtn = document.getElementById("toggleBtn");

            if (password.type === "password") {
                password.type = "text";
                toggleBtn.textContent = "Hide";
            } else {
                password.type = "password";
                toggleBtn.textContent = "Show";
            }
        }
    </script>

</body>
</html>
