<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SmartFix</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            margin: 0;
            background: #f4f7fb;
        }
        .container {
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 15px #ddd;
        }
        h1 {
            text-align: center;
            color: #1e3a8a;
        }
        p {
            text-align: center;
            color: #555;
            line-height: 1.6;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 15px;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #1e3a8a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1e3a8a;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Forgot Password?</h1>
        <p>Enter your registered email address to receive a password reset link.</p>

        <form method="POST">
            <input type="email" name="email"
                   placeholder="Enter your email" required>
            <button type="submit">Send Reset Link</button>
        </form>

        <a href="/login">← Back to Login</a>
    </div>
</body>
</html>
