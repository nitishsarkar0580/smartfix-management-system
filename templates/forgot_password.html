<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | SmartFix</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #071e19, #103c30, #17634b);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 65px;
            height: 65px;
            background: #d8f5e7;
            color: #116149;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 30px;
        }

        .logo h1 {
            font-size: 32px;
            color: #103c30;
            letter-spacing: -1px;
        }

        .logo h1 span {
            color: #16a36c;
        }

        .subtitle {
            margin-top: 8px;
            color: #687c74;
            font-size: 14px;
        }

        .reset-badge {
            display: inline-block;
            background: #e1f7eb;
            color: #116149;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 16px;
            letter-spacing: 1px;
        }

        .heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .heading h2 {
            color: #103c30;
            font-size: 23px;
            margin-bottom: 12px;
        }

        .heading p {
            color: #687c74;
            font-size: 14px;
            line-height: 1.7;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #24473a;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d4e5dc;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #16a36c;
            box-shadow: 0 0 0 3px rgba(22, 163, 108, 0.12);
        }

        .reset-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #116149, #16a36c);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .reset-btn:hover {
            background: linear-gradient(135deg, #0a4635, #118658);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(17, 97, 73, 0.25);
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #116149;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #8b9b93;
        }

        @media (max-width: 480px) {
            .reset-container {
                padding: 30px 22px;
            }

            .logo h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="reset-container">

        <div class="logo">

            <div class="logo-icon">🔐</div>

            <h1>Smart<span>Fix</span></h1>

            <p class="subtitle">
                Smart Repair Management System
            </p>

            <div class="reset-badge">
                ACCOUNT RECOVERY
            </div>

        </div>

        <div class="heading">

            <h2>Forgot Password?</h2>

            <p>
                No worries! Enter your registered email address
                and we'll help you reset your password.
            </p>

        </div>

        <form method="POST">

            <div class="form-group">

                <label for="email">Registered Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

            </div>

            <button type="submit" class="reset-btn">
                Send Reset Link →
            </button>

        </form>

        <a href="/login" class="back-login">
            ← Back to Login
        </a>

        <div class="footer">
            © SmartFix | Secure Account Recovery
        </div>

    </div>

</body>
</html>
