<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Technician Registration - SmartFix</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .register-box {
            width: 420px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;

            margin-bottom: 8px;

            color: #222;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-top: 12px;
            margin-bottom: 6px;

            font-weight: bold;
        }

        input,
        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 14px;
        }

        button {
            width: 100%;

            padding: 12px;

            margin-top: 22px;

            background: #222;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .links {
            text-align: center;

            margin-top: 20px;
        }

        .links a {
            color: #333;

            text-decoration: none;

            margin: 0 5px;
        }

    </style>

</head>


<body>


    <div class="register-box">

        <h1>SmartFix</h1>

        <p class="subtitle">
            Technician Registration
        </p>


        <form method="POST">


            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter technician name"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >


            <label>
                Mobile Number
            </label>

            <input
                type="tel"
                name="mobile"
                placeholder="Enter mobile number"
                required
            >


            <label>
                Specialization
            </label>

            <select name="specialization" required>

                <option value="">
                    Select Specialization
                </option>

                <option value="Mobile Repair">
                    Mobile Repair
                </option>

                <option value="Laptop Repair">
                    Laptop Repair
                </option>

                <option value="Computer Repair">
                    Computer Repair
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                required
            >


            <button type="submit">
                Register Technician
            </button>


        </form>


        <div class="links">

            <a href="/technician-login">
                Already registered? Login
            </a>

            <br><br>

            <a href="/">
                ← Back to Home
            </a>

        </div>


    </div>


</body>

</html>
