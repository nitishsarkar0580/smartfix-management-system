<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Forgot Password | SmartFix</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #102b25, #1d594a);
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
        }

        h2 {
            text-align: center;
            color: #174b3d;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #666;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #176b51;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background: #10543f; }

        .back {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #176b51;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔐 Admin Forgot Password</h2>
        <p>Enter your registered admin recovery email to receive a password reset link.</p>

        <form method="POST" action="{{ url_for('admin_forgot_password') }}">
            <input
                type="email"
                name="email"
                placeholder="Enter recovery email"
                required
            >

            <button type="submit">Send Reset Link</button>
        </form>

        <a class="back" href="{{ url_for('admin_login') }}">
            ← Back to Admin Login
        </a>
    </div>

</body>
</html>
