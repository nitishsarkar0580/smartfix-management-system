<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Repair Request - SmartFix</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 15px #ddd;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 90px;
            resize: none;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #1e3a8a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1e3a8a;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔧 Repair Request</h1>

        <form method="POST">

            <label>Mobile Number</label>
            <input type="tel" name="mobile" required>

            <label>Service Type</label>

            <select name="service_type" required>
                <option value="">Select Service</option>
                <option value="Mobile Repair">Mobile Repair</option>
                <option value="Laptop Repair">Laptop Repair</option>
                <option value="Computer Repair">Computer Repair</option>
                <option value="Other">Other</option>
            </select>

            <label>Problem Description</label>

            <textarea
                name="description"
                placeholder="Describe your problem..."
                required></textarea>

            <label>Address</label>

            <textarea
                name="address"
                placeholder="Enter your address..."
                required></textarea>

            <button type="submit">
                Submit Repair Request
            </button>

        </form>

        <a class="back" href="/dashboard">
            ← Back to Dashboard
        </a>

    </div>

</body>

</html>
